name: Pages

# Publishes one site with two halves:
#   /        the landing page (landing/, hand-written, no build step)
#   /docs/   the documentation (docs/, built by mkdocs)
#   /assets/ the brand assets, shared with the README — assets/ stays the
#            single source (ADR-023), so nothing is duplicated to serve it here.
#
# Deploys an artifact rather than a branch. Nothing is ever pushed to
# gh-pages, so a bad build cannot overwrite the landing page; the previous
# deploy simply stays up.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'docs/**'
      - 'assets/**'
      - 'CHANGELOG.md'
      # Pulled into docs/license.md by pymdownx.snippets, so it is a site input.
      - 'LICENSE'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install mkdocs
        # Pinned so the site is built by the version this setup was verified
        # against; bump it deliberately after a local `mkdocs build --strict`.
        run: pip install 'mkdocs-material==9.7.7'

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r landing/. _site/
          cp -r assets _site/assets
          mkdocs build --strict -d _site/docs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
