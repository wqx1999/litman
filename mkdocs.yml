site_name: litman
site_description: Keep every paper you read on your own computer, and let an AI assistant do the filing.
site_url: https://litman.dev/docs/
repo_url: https://github.com/wqx1999/litman
repo_name: wqx1999/litman
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: /assets/mark.svg
  favicon: /img/favicon.png
  # The landing page's own faces: the system UI stack and JetBrains Mono,
  # both wired up in stylesheets/litman.css. Left as `false` so the build
  # never reaches for Google Fonts.
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  # Follows the reader's system setting, like the landing page does, and the
  # toggle overrides it from there.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  # The logo and the site name are the way back out to the landing page.
  # Without this they point at /docs/, which only redirects to the page the
  # reader is already on.
  homepage: https://litman.dev/

# Sits at the foot of every page, so the way home is reachable from the
# bottom of a long one too. Absolute paths, like the logo above.
copyright: >
  <a href="/">litman.dev</a> &middot;
  <a href="/docs/license/">AGPL-3.0</a>

extra_css:
  - stylesheets/litman.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # base_path reaches the repo root so changelog.md can pull in CHANGELOG.md,
  # which lives there because GitHub and PyPI both expect it there.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

nav:
  - Home: 0-readme.md
  - Philosophy: 1-philosophy.md
  - Architecture: 2-architecture.md
  - Concepts: 3-concepts.md
  - Commands: 4-commands.md
  - Tutorial: 5-tutorial.md
  - Agent model benchmark: 6-agent-benchmark.md
  - Changelog: changelog.md
  - License: license.md
